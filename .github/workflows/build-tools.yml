name: Build tools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-job:
    name: Build ${{ matrix.binary }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: manifest-tool
            binary: ManifestTool
          - package: archive-tool
            binary: ArchiveTool
          - package: luadiff-tool
            binary: LuaDiffTool
          - package: deccli-tool
            binary: DeccliTool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout ss-tools
        uses: actions/checkout@v6
        with:
          repository: MakoStar/ss-tools
          path: ss-tools
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ss-tools/target
          key: cargo-cache-${{ hashFiles('ss-tools/Cargo.lock') }}
          restore-keys: cargo-cache-

      - name: Build ${{ matrix.binary }}
        run: cargo build -p ${{ matrix.package }} --release
        working-directory: ss-tools

      - name: Upload ${{ matrix.binary }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.binary }}
          path: ss-tools/target/release/${{ matrix.binary }}

  commit-job:
    name: Commit all tools
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: ./artifacts

      - name: Prepare tools
        run: |
          for dir in ./artifacts/*/; do
            tool=$(basename "$dir")
            mkdir -p "$tool"
            cp "$dir"/* "$tool/"
          done

      - name: Auto commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *Tool/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update: tools"
            git push
          fi
